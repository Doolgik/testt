<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atelier Coffee · WebGL</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="webgl"></canvas>

  <!-- Бренд-метка -->
  <div class="brand">☕ ATELIER&nbsp;COFFEE</div>

  <!-- Описание, которое летит навстречу стаканчику по мере скролла -->
  <section class="flyer" id="flyer">
    <p class="kicker">SINGLE ORIGIN · СВЕЖАЯ ОБЖАРКА</p>
    <h1>Тёплый<br />глоток утра</h1>
    <p class="desc">
      Бархатная крема, ноты карамели и тёмного шоколада.
      Прокручивай — и наблюдай, как чашка плывёт по дуге.
    </p>
  </section>

  <div class="hint">↓ скролль ↓</div>

  <!-- Пространство для прокрутки -->
  <div class="scrollspace"></div>

  <div class="loader" id="loader"><span>варим кофе…</span></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
